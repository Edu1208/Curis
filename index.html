<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Kuta Kuris - Galería</title>
    <style>
      .card { transition: transform 0.2s; }
      .card:hover { transform: scale(1.03); }
      .card img { height: 250px; object-fit: cover; }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand"><h2>KUTA KURIS</h2></a>
        <form class="d-flex" onsubmit="return false;">
          <input id="buscador" class="form-control me-2" type="search" placeholder="Buscar dibujo..." aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row g-4" id="galeria">

        <div class="col-auto tarjeta" data-titulo="Jos y Edward" data-desc="Se toman de algo las amenazas">
          <div class="card" style="width: 18rem;">
            <img src="https://cdn.discordapp.com/attachments/1548666481087356998/1548782240031314051/303_sin_titulo_20260909133449.png?ex=6aaaf25d&is=6aa9a0dd&hm=39d88ad5056648b8b058b3a987f006d5edb995b2f9a7af41f814cff224fac663&" class="card-img-top" alt="Jos y Edward">
            <div class="card-body">
              <h5 class="card-title">Jos y Edward</h5>
              <p class="card-text">Se toman de algo las amenazas.</p>
            </div>
          </div>
        </div>

        <div class="col-auto tarjeta" data-titulo="Muejejeje" data-desc="Que quieres que ponga w?">
          <div class="card" style="width: 18rem;">
            <img src="https://cdn.discordapp.com/attachments/1548666481087356998/1548901470076796949/240_sin_titulo_20260722025334.png?ex=6aab6167&is=6aaa0fe7&hm=add4f2f5678bad46f925ee0187faf40b41cc455a3ab780df7444fb3d5fcce1e3&" class="card-img-top" alt="Muejejeje">
            <div class="card-body">
              <h5 class="card-title">Muejejeje</h5>
              <p class="card-text">Que quieres que ponga w?</p>
            </div>
          </div>
        </div>

        <!-- Agrega más tarjetas aquí siguiendo el mismo formato -->

      </div>
      <p id="sinResultados" class="text-center text-muted mt-4" style="display:none;">
        No se encontraron dibujos 🔍
      </p>
    </div>

    <script>
      const buscador = document.getElementById('buscador');
      const tarjetas = document.querySelectorAll('.tarjeta');
      const sinResultados = document.getElementById('sinResultados');

      buscador.addEventListener('input', () => {
        const texto = buscador.value.toLowerCase().trim();
        let visibles = 0;

        tarjetas.forEach(tarjeta => {
          const titulo = tarjeta.dataset.titulo.toLowerCase();
          const desc = tarjeta.dataset.desc.toLowerCase();
          const coincide = titulo.includes(texto) || desc.includes(texto);

          tarjeta.style.display = coincide ? '' : 'none';
          if (coincide) visibles++;
        });

        sinResultados.style.display = visibles === 0 ? 'block' : 'none';
      });
    </script>

  </body>
</html>
